name: Security Scanning

on:
  push:
    branches: [main, copilot/**]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Mondays at 9am UTC
    - cron: '0 9 * * 1'

jobs:
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Run Bandit security scanner
        working-directory: backend
        run: bandit -r . -f json -o bandit-report.json || true

      - name: Check Python dependencies for vulnerabilities
        working-directory: backend
        run: safety check --json || true

  javascript-security:
    name: JavaScript Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: my-app
        run: npm ci

      - name: Run npm audit
        working-directory: my-app
        run: npm audit --audit-level=moderate || true

  docker-security:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build backend Docker image
        run: docker build -t perth-events-backend:latest ./backend

      - name: Run Trivy vulnerability scanner (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'perth-events-backend:latest'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'

      - name: Build frontend Docker image
        run: docker build -t perth-events-frontend:latest ./my-app

      - name: Run Trivy vulnerability scanner (frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'perth-events-frontend:latest'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
